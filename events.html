  <script>
    // Remove event cards once their end date has passed.
    // Each card carries a data-end-date (YYYY-MM-DD) for the last day of the
    // event; the card stays visible through the end of that day.
    (function () {
      var now = new Date();
      var cards = document.querySelectorAll('.event-card[data-end-date]');
      cards.forEach(function (card) {
        var end = new Date(card.dataset.endDate + 'T23:59:59');
        if (now > end) {
          card.remove();
        }
      });
      if (document.querySelectorAll('.event-card').length === 0) {
        var message = document.createElement('p');
        message.textContent = 'There are no upcoming events right now. Check back soon!';
        document.querySelector('.events-list').appendChild(message);
      }
    })();
  </script>
